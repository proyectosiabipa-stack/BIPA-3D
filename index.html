<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Recorrido Oficinas BIPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: plano 3D a pantalla completa, panel guía flotante a la izquierda, controles abajo */
:root {
  --bg: #eef1f4; --panel: #ffffffee; --fg: #1d2530; --muted: #5d6877; --line: #d5dbe2;
  --accent: #1f6f8b; --accent-fg: #ffffff; --label-bg: #1d2530e6; --label-fg: #ffffff;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b21; --panel: #1f262eee; --fg: #e6ebf0; --muted: #9aa6b3; --line: #33404c;
  --accent: #5fb3d0; --accent-fg: #0d1a20; --label-bg: #e6ebf0e6; --label-fg: #161b21; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161b21; --panel: #1f262eee; --fg: #e6ebf0; --muted: #9aa6b3; --line: #33404c;
  --accent: #5fb3d0; --accent-fg: #0d1a20; --label-bg: #e6ebf0e6; --label-fg: #161b21; color-scheme: dark }
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; }
#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
/* etiquetas de máquinas: más pequeñas y con el color de acento */
.lbl.mark.desk { background: var(--panel); color: var(--fg); border: 1px solid var(--line); text-align: center; }
.lbl.mark.desk small { display: block; font-size: 9.5px; font-weight: 400; color: var(--muted); }
.lbl.mark { background: var(--accent); color: var(--accent-fg); font-size: 10.5px; padding: 2px 6px; }
.lbl { position: absolute; transform: translate(-50%, -50%); background: var(--label-bg); color: var(--label-fg);
  font-size: 12px; font-weight: 500; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }
.panel { position: absolute; top: 12px; left: 12px; width: min(240px, calc(100% - 24px)); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
  max-height: calc(100% - 100px); backdrop-filter: blur(6px); }
.panel h1 { margin: 0; font-size: 15px; font-weight: 600; text-wrap: balance; }
.panel .sub { margin: 0; font-size: 12px; color: var(--muted); }
.eyebrow { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.panel > * { flex-shrink: 0; }
.panel > .rooms { flex-shrink: 1; min-height: 0; }
.rooms { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.rooms button { width: 100%; text-align: left; background: none; border: 0; color: var(--fg); font: inherit; font-size: 13px;
  padding: 6px 8px; border-radius: 5px; cursor: pointer; }
.rooms button:hover, .rooms button:focus-visible { background: var(--line); outline: none; }
.rooms button.here { background: var(--accent); color: var(--accent-fg); }
.toggle { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.toggle button { border: 0; background: none; color: var(--fg); font: inherit; font-size: 12.5px; padding: 7px 4px; cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.toggle button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.status { position: absolute; top: 12px; right: 12px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 10px; font-size: 13px; max-width: calc(100% - 290px); }
.status b { font-weight: 600; }
.help { position: absolute; bottom: 12px; left: 12px; font-size: 12px; color: var(--muted); background: var(--panel);
  padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); max-width: calc(100% - 200px); }
.pad { position: absolute; bottom: 12px; right: 12px; display: grid; grid-template-columns: repeat(3, 44px); gap: 6px; }
.pad button { height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  font-size: 18px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
.pad button:active { background: var(--accent); color: var(--accent-fg); }
.phead { position: relative; }
.ptoggle { position: absolute; top: -2px; right: 0; font: inherit; font-size: 11.5px; padding: 3px 8px; border-radius: 5px;
  border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; }
.ptoggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.panel.min > :not(.phead) { display: none; }
.panel.min .phead .sub { display: none; }
.pad.zoom { grid-template-columns: repeat(3, 44px); }
.pad.zoom .wide { grid-column: 1 / -1; width: auto; font-size: 12.5px; padding: 0 8px; }
.pad.zoom .wide[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.pad .up { grid-column: 2; } .pad .l { grid-column: 1; grid-row: 2; } .pad .dn { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
.search { width: 100%; font: inherit; font-size: 13px; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--bg); color: var(--fg); }
.search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rooms .kind { color: var(--muted); font-size: 11.5px; margin-left: 6px; }
.rooms button.here .kind { color: inherit; opacity: .8; }
.tourbtn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid var(--accent); background: none; color: var(--accent); text-align: left; }
.tourbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.tour { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); width: min(440px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; font-size: 13.5px;
  box-shadow: 0 6px 24px #0003; display: flex; flex-direction: column; gap: 6px; }
.tour h2 { margin: 0; font-size: 17px; }
.tour p { margin: 0; line-height: 1.45; }
.tour .tstate { color: var(--accent); font-size: 12px; font-weight: 600; }
.tour .tacts { display: flex; gap: 6px; margin-top: 4px; }
.tour button { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--line); background: none; color: var(--fg); }
.tour button.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; margin-left: auto; }
.tour button:disabled { opacity: 0.4; cursor: default; }
.tour button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
@media (max-width: 640px) { .tour { bottom: 120px; } }
.route { border: 1px solid var(--accent); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 7px; font-size: 13px; }
.route b { font-weight: 600; }
.route .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.route .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.route button { font: inherit; font-size: 12.5px; padding: 6px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--line); background: none; color: var(--fg); }
.route button.go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
.route button:focus-visible, .rooms button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
/* Celulares (Android y iPhone): panel compacto arriba, botones grandes abajo, respeta la muesca y la barra de inicio */
html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
#app { height: 100vh; height: 100dvh; }
body.touring .status { display: none; }
@media (max-width: 640px) {
  .panel { top: calc(8px + env(safe-area-inset-top, 0px)); left: 8px; width: calc(100% - 16px); max-height: 52%; padding: 10px 12px; gap: 8px; }
  .panel .sub, .panel .eyebrow:not(label) { display: none; }
  .panel h1 { font-size: 15px; padding-right: 80px; }
  .ptoggle { top: -1px; font-size: 13px; padding: 5px 10px; }
  .toggle button { font-size: 14px; padding: 9px 4px; }
  .tourbtn { font-size: 14px; padding: 9px 10px; }
  .search { font-size: 16px; padding: 9px 10px; }   /* 16px evita que el iPhone haga zoom al escribir */
  .rooms button { font-size: 14px; padding: 9px 8px; }
  .route button { font-size: 14px; padding: 9px 12px; }
  .status { top: auto; left: 8px; right: 172px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-width: none;
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .help { display: none; }
  .pad, .pad.zoom { right: 8px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(3, 48px); }
  .pad button { height: 48px; }
  .lbl { font-size: 11px; padding: 2px 6px; }
  .lbl.mark { font-size: 9.5px; padding: 2px 5px; }
  .lbl.mark.desk small { font-size: 8.5px; }
  .tour { left: 8px; right: 8px; width: auto; transform: none; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-height: 46%; overflow-y: auto; padding: 10px 12px; font-size: 13.5px; }
  .tour h2 { font-size: 16px; }
  .tour button { font-size: 14px; padding: 10px 12px; }
  body.touring #pad { display: none !important; }
  /* v2: menú como botón pequeño, controles de zoom en una columna delgada, ficha del recorrido compacta */
  .panel.min { width: auto; right: auto; padding: 0; border: 0; background: none; backdrop-filter: none; }
  .panel.min .phead h1, .panel.min .phead .eyebrow { display: none; }
  .panel.min .ptoggle { position: static; background: var(--panel); color: var(--fg); font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 8px; box-shadow: 0 2px 8px #0002; }
  .pad.zoom { grid-template-columns: 40px; gap: 4px; bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  .pad.zoom button { height: 40px; width: 40px; font-size: 16px; }
  .pad.zoom .wide { grid-column: auto; width: 40px; padding: 0; font-size: 10px; }
  .status { right: 8px; padding: 6px 10px; }
  body.caminando .status { right: 172px; }
  .pad:not(.zoom) { grid-template-columns: repeat(3, 44px); }
  .pad:not(.zoom) button { height: 44px; }
  .tour { padding: 8px 10px; gap: 3px; max-height: 40%; }
  .tour #tStep { display: none; }
  .tour h2 { font-size: 15px; }
  .tour .tstate { font-size: 11.5px; }
  .tour p#tText { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .tour.abierto p#tText { display: block; }
  .tour .tacts { margin-top: 2px; }
  .tour button { padding: 8px 12px; }
  body.touring .pad.zoom { display: none; }
  .panel:not(.min) ~ .pad.zoom { display: none; }   /* con el menú abierto, los botones de zoom no lo tapan */
}
/* Celular acostado: panel a la izquierda más bajo, recorrido a la izquierda de los botones */
@media (max-height: 500px) and (orientation: landscape) {
  .panel { top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(8px + env(safe-area-inset-left, 0px)); max-height: calc(100% - 16px); padding: 10px; gap: 7px; }
  .panel .sub { display: none; }
  .help { display: none; }
  .status { top: 8px; right: calc(8px + env(safe-area-inset-right, 0px)); max-width: calc(100% - 290px); font-size: 12.5px; }
  .pad, .pad.zoom { right: calc(8px + env(safe-area-inset-right, 0px)); bottom: 8px; }
  .tour { left: calc(8px + env(safe-area-inset-left, 0px)); transform: none; bottom: 8px; width: min(420px, calc(100% - 190px)); max-height: calc(100% - 16px); overflow-y: auto; }
  .lbl { font-size: 11px; }
}
</style>

<div id="app">
  <canvas id="c" aria-label="Modelo 3D de la oficina"></canvas>
  <div class="labels" id="labels"></div>
  <aside class="panel">
    <div class="phead">
      <button class="ptoggle" id="bPanel" aria-expanded="true">Ocultar menú</button>
      <p class="eyebrow">Guía de la empresa</p>
      <h1>Recorrido de la empresa</h1>
      <p class="sub">Según croquis · medidas aproximadas</p>
    </div>
    <div class="toggle" role="group" aria-label="Modo de vista">
      <button id="bAerea" aria-pressed="true">Vista aérea</button>
      <button id="bPaseo" aria-pressed="false">Caminar</button>
    </div>
    <button class="tourbtn" id="bTour">▶ Recorrido guiado de inducción</button>
    <label class="eyebrow" for="q">Buscar persona o lugar</label>
    <input class="search" id="q" type="search" placeholder="Ej.: Karla, Baños, Máquina 3" autocomplete="off">
    <div class="route" id="route" hidden>
      <div>Ruta a <b id="rName"></b><div class="meta" id="rMeta"></div></div>
      <div class="acts"><button class="go" id="rGo">Llévame caminando</button><button id="rClear">Quitar ruta</button></div>
    </div>
    <ul class="rooms" id="rooms"></ul>
  </aside>
  <section class="tour" id="tour" hidden aria-live="polite">
    <p class="eyebrow" id="tStep"></p>
    <h2 id="tName"></h2>
    <p class="tstate" id="tState"></p>
    <p id="tText"></p>
    <div class="tacts"><button id="tPrev">◀ Anterior</button><button class="go" id="tNext">Siguiente ▶</button><button id="tExit">Salir</button></div>
  </section>
  <div class="status" id="status">Toca una zona para ver su nombre</div>
  <div class="help" id="help">Arrastra para moverte · clic derecho o dos dedos para girar · rueda o pellizco para acercar donde apuntas · doble clic para ir ahí</div>
  <div class="pad zoom" id="zoom">
    <button id="zIn" aria-label="Acercar">+</button>
    <button id="zOut" aria-label="Alejar">−</button>
    <button id="zAll" aria-label="Ver todo el terreno">⤢</button>
    <button id="gL" aria-label="Girar vista a la izquierda" title="Girar a la izquierda (Q)">⟲</button>
    <button id="gR" aria-label="Girar vista a la derecha" title="Girar a la derecha (E)">⟳</button>
    <button id="gTilt" aria-label="Inclinar la vista" title="Ver más desde arriba o más de lado">↕</button>
    <button id="gMode" class="wide" aria-pressed="false">Arrastrar: mover</button>
  </div>
  <div class="pad" id="pad" hidden>
    <button class="up" data-k="f" aria-label="Avanzar">▲</button>
    <button class="l" data-k="l" aria-label="Girar a la izquierda">◀</button>
    <button class="dn" data-k="b" aria-label="Retroceder">▼</button>
    <button class="r" data-k="r" aria-label="Girar a la derecha">▶</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MapControls } from 'three/addons/controls/MapControls.js';

// Cambia esta ruta si subes el modelo a otra carpeta de tu web
const MODEL_URL = 'empresa.glb';
const EYE = 1.6, SPEED = 4.5, TURN = 1.8, RADIUS = 0.3;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const MOVIL = matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 640px)').matches;
const MOVIL_UI = matchMedia('(max-width: 640px)').matches;   // pantalla de celular parado: controles compactos
renderer.setPixelRatio(Math.min(devicePixelRatio, MOVIL ? 1.5 : 2));   // en celulares, menos píxeles = más fluido y menos batería
const scene = new THREE.Scene();
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const setBg = () => { scene.background = new THREE.Color(css('--bg').slice(0, 7)); };
setBg(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setBg);
new MutationObserver(setBg).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 500);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 2.2));
scene.add(new THREE.AmbientLight(0xffffff, 0.7));   // aclara los interiores con techo
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(20, 40, 10); scene.add(sun);

// Controles tipo mapa: arrastrar mueve, clic derecho o dos dedos giran, la rueda acerca hacia donde apunta el cursor
const orbit = new MapControls(camera, canvas);
orbit.enableDamping = true; orbit.maxPolarAngle = Math.PI * 0.48;
orbit.zoomToCursor = true; orbit.minDistance = 2; orbit.zoomSpeed = 1.2;

const walls = [], pickables = [], rooms = [], marks = [], techos = [];
const labelsEl = document.getElementById('labels'), statusEl = document.getElementById('status');
const roomsEl = document.getElementById('rooms');

// Tipo y nombre del objeto: sube por la jerarquía hasta el nodo que los guarda
const objInfo = o => { while (o && !o.userData.nombre) o = o.parent; return o ? o.userData : null; };

new GLTFLoader().load(MODEL_URL, gltf => {
  const root = gltf.scene; scene.add(root);
  root.updateMatrixWorld(true);
  root.traverse(o => {
    if (!o.isMesh) return;
    if (['Pared', 'Máquina'].includes(objInfo(o)?.tipo)) walls.push(o);   // no se atraviesan
    if (objInfo(o)?.tipo === 'Techo') { techos.push(o); o.visible = walker.on; return; }   // techos: solo al caminar
    pickables.push(o);
  });
  root.children.forEach(o => {
    if (['Máquina', 'Escritorio'].includes(o.userData.tipo) && o.userData.centro) {
      const desk = o.userData.tipo === 'Escritorio';
      const el = document.createElement('div'); el.className = desk ? 'lbl mark desk' : 'lbl mark'; el.textContent = o.userData.persona || o.userData.nombre; if (o.userData.cargo) { const c = document.createElement('small'); c.textContent = o.userData.cargo; el.appendChild(c); } labelsEl.appendChild(el);
      // los nombres de los escritorios solo aparecen al acercarse
      marks.push({ el, desk, name: o.userData.persona || o.userData.nombre, cargo: o.userData.cargo, clave: o.userData.nombre, kind: o.userData.tipo, center: new THREE.Vector3(o.userData.centro[0], o.userData.centro[2] || 0, o.userData.centro[1]) });
      return;
    }
    if (o.userData.tipo !== 'Sala') return;
    const box = new THREE.Box3().setFromObject(o);
    const name = o.userData.nombre;
    const el = document.createElement('div'); el.className = 'lbl'; el.textContent = name; labelsEl.appendChild(el);
    const [cx, cz] = o.userData.centro || [box.getCenter(new THREE.Vector3()).x, box.getCenter(new THREE.Vector3()).z];
    const size = box.getSize(new THREE.Vector3());
    const nv = o.userData.nivel;   // planta alta (p. ej. Logística encima del almacén)
    const r = { name, kind: 'Sala', box, poly: o.userData.contorno, size: Math.max(size.x, size.z), center: new THREE.Vector3(cx, nv ? nv.alto : 0, cz), el, nivel: nv };
    if (nv) niveles.push(nv);
    rooms.push(r);
  });
  const all = new THREE.Box3().setFromObject(root);
  const c = all.getCenter(new THREE.Vector3());
  span = Math.max(all.max.x - all.min.x, all.max.z - all.min.z);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(span * 8, span * 8), new THREE.MeshLambertMaterial({ color: 0xb9bdb3 }));
  ground.rotation.x = -Math.PI / 2; ground.position.set(c.x, -0.2, c.z); scene.add(ground);
  home = c; aerial();
  walker.pos.set(-2, 0, 66); walker.yaw = -Math.PI / 2;   // en la entrada principal, mirando hacia dentro
  buildGrid(root, all);
  renderList();
}, undefined, () => { statusEl.textContent = 'No se pudo cargar ' + MODEL_URL + '. Súbelo junto a esta página.'; });

// ---- Modo caminar ----
const walker = { on: false, pos: new THREE.Vector3(), yaw: 0, pitch: -0.05 };
const keys = {};
const ray = new THREE.Raycaster();
function blocked(from, dir, dist) {
  ray.set(new THREE.Vector3(from.x, from.y + 1.0, from.z), dir); ray.far = dist + RADIUS;
  return ray.intersectObjects(walls, false).length > 0;
}
function step(dt) {
  let turn = 0, move = 0;
  if (keys.ArrowLeft || keys.a || keys.l) turn += 1;
  if (keys.ArrowRight || keys.d || keys.r) turn -= 1;
  if (keys.ArrowUp || keys.w || keys.f) move += 1;
  if (keys.ArrowDown || keys.s || keys.b) move -= 1;
  walker.yaw += turn * TURN * dt;
  if (move) {
    const dir = new THREE.Vector3(-Math.sin(walker.yaw), 0, -Math.cos(walker.yaw)).multiplyScalar(Math.sign(move));
    const d = SPEED * dt;
    // desliza a lo largo de las paredes probando cada eje por separado
    for (const ax of [new THREE.Vector3(dir.x, 0, 0), new THREE.Vector3(0, 0, dir.z)]) {
      const len = ax.length(); if (len < 1e-4) continue;
      ax.normalize(); if (!blocked(walker.pos, ax, d * len)) walker.pos.addScaledVector(ax, d * len);
    }
  }
  walker.pos.y = alturaPiso(walker.pos.x, walker.pos.z, walker.pos.y);
  camera.position.set(walker.pos.x, walker.pos.y + EYE, walker.pos.z);

  if (!follow.pts.length) follow = null;
};

// ---- Recorrido guiado de inducción ----
// Paradas en orden: 'sala' es el nombre exacto de la zona en el modelo; 'texto' se puede editar libremente.
const TOUR = [
  { sala: 'Entrada principal', texto: 'Bienvenido a BIPA. Por aquí entran el personal, las visitas y los vehículos, por el portón azul. Vigilancia está justo al lado.' },
  { sala: 'Vigilancia', texto: 'Caseta de vigilancia. Aquí se anuncian las visitas y proveedores antes de pasar.' },
  { sala: 'Estacionamiento autos', texto: 'Estacionamiento de autos y camiones. Al lado está el de motos. Al fondo se ve el silo del vecino.' },
  { sala: 'Entrada galpón de la leche', texto: 'Acceso al galpón de la leche desde la vía interna.' },
  { sala: 'Galpón de la leche', texto: 'Galpón de la leche. Aquí están la mesa de secado y el área de empaquetado.' },
  { sala: 'Empaquetado', texto: 'Área de empaquetado del galpón de la leche.' },
  { sala: 'Producción (máquinas)', texto: 'Galpón de producción con las 6 máquinas, las mesas de empaque y etiquetado, el almacén de productos y encima la oficina de Logística.' },
  { sala: 'Almacén de productos', texto: 'Almacén de productos, en planta baja dentro del galpón de producción, con estanterías de producto terminado.' },
  { sala: 'Logística', texto: 'Oficina de Logística, en la planta alta encima del almacén de productos. Se sube por la escalera metálica desde producción. Aquí trabajan Lic. Yormary Barrios (logística y despacho) y Lic. Paola (inventarios y suministros).' },
  { sala: 'Patio', texto: 'Patio de servicio: tanques de agua y portón azul de entrada al galpón de oficinas y velas.' },
  { sala: 'Área de trabajo velas aromáticas', texto: 'Área de trabajo de velas aromáticas: mesas de acero, llenadora y pasillo peatonal amarillo.' },
  { sala: 'Oficina de Directivos', texto: 'Oficina de Directivos, detrás del frente de vidrio: sala con sillones, mesón y exhibición de productos. Aquí trabajan los directores generales, Ing. Andrés Maldonado e Ing. Edgardo Jeréz.' },
  { sala: 'Oficina de ventas', texto: 'Oficina de ventas (comercial): Lic. Maria Molina y Lic. Karla Montilla (líderes comerciales), Giannfranco Araujo (analista de inteligencia comercial), Ing. Octavio (coordinador de ventas) y Lic. Francis Suárez (cotización y facturación).' },
  { sala: 'Almacén', texto: 'Almacén, detrás del portón gris, con sus estanterías.' },
  { sala: 'Cocina', texto: 'Cocina: nevera, microondas y fregadero para el personal.' },
  { sala: 'Comedor', texto: 'Comedor con mesa alta y dispensador de agua.' },
  { sala: 'Baño damas', texto: 'Baños: el de damas está aquí y el de caballeros justo al lado.' },
  { sala: 'Sala de reuniones', texto: 'Sala de reuniones.' },
  { sala: 'Archivo', texto: 'Archivo: carpetas y documentos de la empresa.' },
  { sala: 'Oficina administrativa', texto: 'Oficina administrativa: Lic. Fabiola (gerente general), Doc. Pedro Jeréz (abogado empresarial), Lic. Mariana Materano (tesorería), Lic. Dailimar Barrios (cobranza y pago de comisiones), Omaimar y el servidor.' },
  { sala: 'Velas aromáticas', texto: 'Depósito de velas aromáticas terminadas. Fin del recorrido: ¡bienvenido al equipo!' },
];
let tour = null;
const tourEl = document.getElementById('tour');
function tourShow() {
  const st = TOUR[tour.i], r = rooms.find(x => x.name === st.sala);
  document.getElementById('tStep').textContent = `Parada ${tour.i + 1} de ${TOUR.length}`;
  document.getElementById('tName').textContent = MOVIL_UI ? `${tour.i + 1}/${TOUR.length} · ${st.sala}` : st.sala;
  tourEl.classList.remove('abierto');
  document.getElementById('tText').textContent = st.texto;
  document.getElementById('tState').textContent = tour.walking ? 'Caminando hacia aquí…' : 'Estás aquí';
  document.getElementById('tPrev').disabled = tour.i === 0;
  document.getElementById('tNext').textContent = tour.i === TOUR.length - 1 ? 'Terminar' : 'Siguiente ▶';
  if (MOVIL_UI) { document.getElementById('tPrev').textContent = '◀'; document.getElementById('tExit').textContent = '✕'; }
  statusEl.innerHTML = ''; statusEl.append('Recorrido guiado · ', Object.assign(document.createElement('b'), { textContent: st.sala }));
  return r;
}
function tourGo(i) {
  tour.i = i; const r = rooms.find(x => x.name === TOUR[i].sala);
  if (!r) { tour.walking = false; tourShow(); return; }
  showRoute(r);
  if (route && route.length > 1 && walker.pos.distanceTo(route[route.length - 1]) > 0.5) {
    follow = { pts: route.slice(1), i: 0 }; tour.walking = true;
  } else tour.walking = false;
  tourShow();
}
function tourStart() {
  if (!G) return;
  clearRoute(); setMode(true);
  document.querySelector('.panel').classList.add('min'); document.getElementById('bPanel').textContent = '☰ Menú';
  tour = { i: 0, walking: false }; tourEl.hidden = false; document.body.classList.add('touring');
  const r = rooms.find(x => x.name === TOUR[0].sala);
  if (r) { const c = nearestFree(...toCell(r.center.x, r.center.z)); if (c) { const [x, z] = cellPos(...c); walker.pos.set(x, 0, z); } }
  walker.yaw = -Math.PI / 2 + 0.6; tourShow();
}
function tourEnd() { tour = null; tourEl.hidden = true; document.body.classList.remove('touring'); follow = null; clearRoute(); statusEl.textContent = 'Recorrido terminado'; }
document.getElementById('bTour').onclick = tourStart;
document.getElementById('tNext').onclick = () => { if (!tour) return; if (tour.i === TOUR.length - 1) tourEnd(); else tourGo(tour.i + 1); };
document.getElementById('tPrev').onclick = () => { if (tour && tour.i > 0) tourGo(tour.i - 1); };
document.getElementById('tExit').onclick = tourEnd;
document.getElementById('tText').onclick = () => tourEl.classList.toggle('abierto');
function tourTick() { if (tour && tour.walking && !follow) { tour.walking = false; tourShow(); } }

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const clock = new THREE.Clock(), v = new THREE.Vector3(), tmp2 = new THREE.Vector3();
let lastRoom = null;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (fly) {
    fly.t = Math.min(1, fly.t + dt * 1.5); const k = fly.t * fly.t * (3 - 2 * fly.t);
    orbit.target.lerpVectors(fly.from, fly.to, k); camera.position.lerpVectors(fly.camFrom, fly.camTo, k);
    if (fly.arco) {   // al girar, la cámara recorre un arco (misma distancia) en vez de una recta
      const a = new THREE.Spherical().setFromVector3(fly.arco.off), b = fly.arco.sph;
      a.theta += (b.theta - a.theta) * k; a.phi += (b.phi - a.phi) * k;
      camera.position.copy(orbit.target).add(new THREE.Vector3().setFromSpherical(a));
    }
    if (fly.t === 1) fly = null;
  }
  if (walker.on) { if (follow) followStep(dt); else step(dt); } else orbit.update();
  tourTick();
  if (pathDots) pathDots.material.opacity = 0.65 + 0.35 * Math.sin(clock.elapsedTime * 4);
  const here = walker.on ? roomAt(walker.pos) : null;
  if (here !== lastRoom) {
    renderList();
    if (here) { statusEl.innerHTML = 'Estás en <b></b>'; statusEl.querySelector('b').textContent = here.name; }
    lastRoom = here;
  }
  const w = canvas.clientWidth, h = canvas.clientHeight;
  for (const r of rooms) {
    v.set(r.center.x, r.center.y + (walker.on ? 2.3 : 0.4), r.center.z).project(camera);
    const dist = camera.position.distanceTo(r.center);
    const show = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 && (!walker.on || (dist < 22 && r !== here && !behindWall(tmp2.set(r.center.x, r.center.y + 1.5, r.center.z))));
    r.el.hidden = !show;
    if (show) r._x = (v.x + 1) / 2 * w, r._y = (1 - v.y) / 2 * h;
  }
  for (const m of marks) {
    v.set(m.center.x, m.center.y + (m.desk ? 1.3 : (walker.on ? 2.8 : 2.4)), m.center.z).project(camera);
    const d = camera.position.distanceTo(m.center);
    const show = v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1 && (m.desk ? d < 16 : (!walker.on || d < 18)) && !behindWall(tmp2.set(m.center.x, m.center.y + 1.2, m.center.z));
    m.el.hidden = !show;
    if (show) m._x = (v.x + 1) / 2 * w, m._y = (1 - v.y) / 2 * h;
  }
  // etiquetas que se tapan entre sí: se muestra solo la primera (personas, luego salas, luego máquinas)
  const puestos = [];
  for (const it of [...marks.filter(m => m.desk), ...rooms, ...marks.filter(m => !m.desk)]) {
    if (it.el.hidden) continue;
    const bw = it.el.offsetWidth / 2 + 2, bh = it.el.offsetHeight / 2 + 1;
    if (puestos.some(q => Math.abs(q[0] - it._x) < q[2] + bw && Math.abs(q[1] - it._y) < q[3] + bh)) { it.el.hidden = true; continue; }
    puestos.push([it._x, it._y, bw, bh]);
    it.el.style.left = it._x + 'px'; it.el.style.top = it._y + 'px';
  }
  renderer.render(scene, camera);
});
</script>
